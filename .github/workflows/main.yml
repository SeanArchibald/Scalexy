name: build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.read.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - name: Read version
        id: read
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Prepare for JUCE
        run: |
          sudo apt-get update
          sudo apt install libfontconfig1-dev libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype6-dev libglu1-mesa-dev libjack-jackd2-dev
      - name: Run CMake
        run: |
          cmake -S . -B ./build -DCMAKE_BUILD_TYPE=Release
          cmake --build ./build --config Release --parallel 3 --target SCALESPACE_VST3
      - name: Package
        run: |
          tar -czf "$GITHUB_WORKSPACE/Scalexy-v${{ needs.version.outputs.value }}-Linux-x64.tar.gz" \
            -C ./build/SCALESPACE_artefacts/Release/VST3 "Scalexy.vst3"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ github.workspace }}/Scalexy-v${{ needs.version.outputs.value }}-Linux-x64.tar.gz
          name: linux
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Run CMake
        run: |
          cmake -S . -B ./build -DCMAKE_BUILD_TYPE=Release
          cmake --build ./build --config Release --parallel 3 --target SCALESPACE_VST3
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "build\SCALESPACE_artefacts\Release\VST3\Scalexy.vst3" `
            -DestinationPath "Scalexy-v${{ needs.version.outputs.value }}-Windows-x64.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: Scalexy-v${{ needs.version.outputs.value }}-Windows-x64.zip
          name: windows
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Run CMake
        run: |
          cmake -S . -B ./build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build ./build --config Release --parallel 3 --target SCALESPACE_VST3
      - name: Verify universal binary
        run: |
          lipo -info "build/SCALESPACE_artefacts/Release/VST3/Scalexy.vst3/Contents/MacOS/Scalexy"
      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/SCALESPACE_artefacts/Release/VST3/Scalexy.vst3" \
            "Scalexy-v${{ needs.version.outputs.value }}-macOS-universal.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: Scalexy-v${{ needs.version.outputs.value }}-macOS-universal.zip
          name: macos
          if-no-files-found: error

  release:
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.value }}
          name: Scalexy v${{ needs.version.outputs.value }}
          body: ""
          files: dist/*
          fail_on_unmatched_files: true
